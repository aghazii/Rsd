<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05080f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="رصد" />
  <link rel="apple-touch-icon" href="Icon.png" />
  <title>رصد — إدارة مالية ذكية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root{
      --gold-0:#fff8e7;--gold-1:#f5d770;--gold-2:#c9a030;--gold-3:#8b6410;--gold-4:#4a3205;
      --bg:#05080f;--bg-2:#080d18;--bg-3:#0d1525;--bg-4:#121c30;--bg-5:#1a2640;
      --text:#f2ede0;--muted:#a8b0c0;--faint:#68708a;--line:rgba(197,160,48,.12);
      --green:#00c896;--red:#ff4d5e;--blue:#3d8eff;--amber:#ffb020;
      --radius-xl:28px;--radius-lg:22px;--radius-md:16px;--radius-sm:12px;
      --safe-top:env(safe-area-inset-top, 44px);--safe-bottom:env(safe-area-inset-bottom, 34px);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;overflow:hidden}
    body{background:radial-gradient(circle at 50% -20%,rgba(197,160,48,.12),transparent 40%),var(--bg)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer;border:0}
    input,select,textarea{width:100%;border:1px solid rgba(255,255,255,.08);background:var(--bg-3);color:var(--text);border-radius:var(--radius-sm);padding:13px 14px;outline:none;transition:.2s}
    input:focus,select:focus,textarea:focus{border-color:var(--gold-2);box-shadow:0 0 0 4px rgba(201,160,48,.08)}
    select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold-1) 50%),linear-gradient(135deg,var(--gold-1) 50%,transparent 50%);background-position:left 18px center,left 12px center;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-left:34px}
    label{display:flex;flex-direction:column;gap:7px;color:var(--muted);font-size:12px;font-weight:800}
    textarea{resize:none;line-height:1.6}

    @keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes pinPress{0%{transform:scale(1)}50%{transform:scale(.92)}100%{transform:scale(1)}}

    .screen{position:fixed;inset:0;display:none;overflow:auto;padding:calc(var(--safe-top) + 20px) 20px calc(var(--safe-bottom) + 20px);animation:slideUp .5s ease}
    .screen.active{display:block}
    .splash-screen{background:linear-gradient(135deg,#0a1528 0%,#05080f 50%,#0d1c38 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
    .splash-logo{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,var(--gold-0),var(--gold-1),var(--gold-2));display:grid;place-items:center;color:#1a0e00;font-family:'Tajawal',sans-serif;font-size:60px;font-weight:900;box-shadow:0 30px 80px rgba(201,160,48,.4);animation:pulse 2s ease-in-out infinite;cursor:pointer}
    .splash-text{text-align:center;animation:fadeIn 1s ease .3s backwards}
    .splash-text h1{font-family:'Tajawal',sans-serif;font-size:32px;font-weight:900;margin-bottom:8px}
    .splash-text p{color:var(--muted);font-size:14px}

    .pin-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:40px;padding:0 20px}
    .pin-container{display:flex;flex-direction:column;align-items:center;gap:35px;width:100%}
    .pin-title{text-align:center;font-family:'Tajawal',sans-serif;font-size:28px;font-weight:900}
    .pin-dots{display:flex;gap:15px;justify-content:center}
    .pin-dot{width:16px;height:16px;border-radius:50%;background:var(--bg-4);border:2px solid var(--line);transition:.2s}
    .pin-dot.filled{background:var(--gold-2);border-color:var(--gold-1);box-shadow:0 0 12px rgba(201,160,48,.4)}
    .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:300px;margin:0 auto}
    .pin-btn{aspect-ratio:1;border-radius:20px;background:linear-gradient(135deg,rgba(201,160,48,.12),rgba(201,160,48,.08));border:1.5px solid rgba(201,160,48,.25);color:var(--text);font-size:26px;font-weight:900;transition:.15s;box-shadow:0 8px 24px rgba(0,0,0,.3);backdrop-filter:blur(10px)}
    .pin-btn:active{animation:pinPress .2s ease;background:linear-gradient(135deg,rgba(201,160,48,.25),rgba(201,160,48,.15));box-shadow:0 4px 12px rgba(201,160,48,.2)}
    .pin-btn.delete{grid-column:3;background:linear-gradient(135deg,rgba(255,77,94,.12),rgba(255,77,94,.08));border-color:rgba(255,77,94,.25);color:var(--red)}
    .pin-btn.delete:active{background:linear-gradient(135deg,rgba(255,77,94,.25),rgba(255,77,94,.15))}
    .pin-btn.zero{grid-column:2}

    .auth-screen{align-content:center;justify-items:center}
    .brand-card{text-align:center;margin:0 auto 24px;max-width:360px}
    .coin-logo{width:88px;height:88px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 25%,var(--gold-0),var(--gold-1) 38%,var(--gold-3));color:#1b1000;font-family:'Tajawal',sans-serif;font-size:42px;font-weight:900;box-shadow:0 18px 55px rgba(201,160,48,.32);cursor:pointer}
    .brand-card h1{font-family:'Tajawal',sans-serif;font-size:42px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,var(--gold-0),var(--gold-1),var(--gold-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .brand-card p{color:var(--muted);font-size:14px;line-height:1.8;margin-top:8px}
    .auth-card,.panel,.modal-card{background:rgba(8,13,24,.88);border:1px solid var(--line);border-radius:var(--radius-xl);box-shadow:0 25px 70px rgba(0,0,0,.45);backdrop-filter:blur(24px)}
    .auth-card{width:min(430px,100%);margin:auto;padding:16px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg-3);border-radius:var(--radius-md);padding:5px;margin-bottom:16px}
    .tab{padding:11px;border-radius:12px;background:transparent;color:var(--faint);font-weight:900;transition:.2s}
    .tab.active{background:linear-gradient(135deg,var(--gold-4),var(--gold-2));color:#1a0e00}
    .form{display:none;flex-direction:column;gap:13px}
    .form.active{display:flex}
    .error{display:none;background:rgba(255,77,94,.1);border:1px solid rgba(255,77,94,.22);color:var(--red);border-radius:12px;padding:10px;font-size:12px;text-align:center}
    .error.show{display:block}
    .primary-btn,.secondary-btn,.ghost-btn,.small-btn,.link-btn{border-radius:14px;font-weight:900;transition:.18s}
    .primary-btn{width:100%;padding:15px;background:linear-gradient(135deg,var(--gold-4),var(--gold-2),var(--gold-1));color:#1a0e00;box-shadow:0 14px 35px rgba(201,160,48,.22)}
    .secondary-btn{padding:14px;background:var(--bg-4);color:var(--text);border:1px solid rgba(255,255,255,.08)}
    .ghost-btn{padding:9px 12px;background:rgba(201,160,48,.1);color:var(--gold-1);border:1px solid var(--line)}
    .small-btn{padding:9px 12px;background:var(--bg-4);color:var(--gold-1);border:1px solid var(--line);font-size:12px}
    .small-btn.danger{color:var(--red);border-color:rgba(255,77,94,.25);background:rgba(255,77,94,.08)}
    .link-btn{background:transparent;color:var(--gold-1);font-size:12px}
    button:active{transform:scale(.97)}

    .onboarding-screen{background:var(--bg);padding-bottom:120px}
    .top-line{display:flex;justify-content:space-between;align-items:center;color:var(--faint);font-weight:800;font-size:12px;margin-bottom:16px}
    .progress-dots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:26px}
    .progress-dots span{height:5px;border-radius:99px;background:var(--bg-4);transition:.3s}
    .progress-dots span.active{background:var(--gold-2)}
    .onboarding-body{display:flex;flex-direction:column;gap:18px}
    .onboarding-body h1{font-family:'Tajawal',sans-serif;font-size:30px;font-weight:900;line-height:1.25}
    .onboarding-body p{color:var(--muted);line-height:1.9;font-size:14px}
    .bottom-btn{position:fixed;left:20px;right:20px;bottom:calc(var(--safe-bottom) + 18px);width:auto}

    .app-screen{position:fixed;inset:0;display:none;overflow:auto;padding:calc(var(--safe-top) + 12px) 16px calc(86px + var(--safe-bottom));background:var(--bg)}
    .app-screen.active{display:block}
    .app-header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}
    .app-header h2{font-family:'Tajawal',sans-serif;font-size:22px;font-weight:900}
    .muted{color:var(--faint);font-size:12px}.muted-text{color:var(--muted);font-size:13px;line-height:1.8}
    .header-actions{display:flex;align-items:center;gap:8px}
    .avatar{width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,var(--gold-4),var(--gold-2));color:#1a0e00;font-family:'Tajawal',sans-serif;font-weight:900;font-size:18px;display:grid;place-items:center;cursor:pointer;transition:.2s}
    .avatar:active{transform:scale(.95)}
    .month-tabs{display:flex;gap:8px;overflow:auto;margin:8px -16px 12px;padding:0 16px 4px;scrollbar-width:none}.month-tabs::-webkit-scrollbar{display:none}
    .month-tab{padding:10px 16px;border-radius:12px;background:var(--bg-3);border:1px solid var(--line);color:var(--muted);font-weight:800;font-size:13px;white-space:nowrap;cursor:pointer;transition:.2s}
    .month-tab.active{background:linear-gradient(135deg,var(--gold-4),var(--gold-2));color:#1a0e00;border-color:transparent}
    
    .summary-card{background:rgba(201,160,48,.08);border:1px solid rgba(201,160,48,.15);border-radius:var(--radius-lg);padding:18px;margin-bottom:16px}
    .summary-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .summary-row:last-child{margin-bottom:0}
    .summary-label{color:var(--muted);font-size:13px}
    .summary-value{font-family:'Tajawal',sans-serif;font-size:20px;font-weight:900;color:var(--gold-1)}
    
    .chart-container{position:relative;width:100%;max-width:280px;height:280px;margin:0 auto 20px}
    .pie-chart{width:100%;height:100%}
    .chart-label{position:absolute;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
    .chart-percentage{color:var(--gold-1);font-size:14px;font-weight:900}
    .chart-name{color:var(--muted);font-size:11px}
    
    .debt-section{margin-bottom:20px}
    .section-title{font-family:'Tajawal',sans-serif;font-size:18px;font-weight:900;margin-bottom:12px;color:var(--text)}
    .debt-item{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
    .debt-info{flex:1}
    .debt-name{color:var(--text);font-weight:800;margin-bottom:4px}
    .debt-date{color:var(--faint);font-size:12px}
    .debt-amount{font-family:'Tajawal',sans-serif;font-weight:900;color:var(--gold-1)}
    
    .goal-item{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px;margin-bottom:10px}
    .goal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .goal-name{color:var(--text);font-weight:800}
    .goal-amount{font-family:'Tajawal',sans-serif;font-weight:900;color:var(--gold-1)}
    .goal-progress{width:100%;height:8px;background:var(--bg-4);border-radius:99px;overflow:hidden}
    .goal-bar{height:100%;background:linear-gradient(90deg,var(--green),var(--gold-1));border-radius:99px;transition:.3s}
    
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,13,24,.95);border-top:1px solid var(--line);backdrop-filter:blur(24px);display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding-bottom:var(--safe-bottom)}
    .nav-btn{padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--faint);font-size:11px;font-weight:800;transition:.2s}
    .nav-btn.active{color:var(--gold-1)}
    .nav-icon{font-size:20px}
    
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
    .modal-overlay.active{display:flex}
    .modal-card{width:min(420px,100%);max-height:80vh;overflow:auto}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
    .modal-header h3{font-family:'Tajawal',sans-serif;font-size:20px;font-weight:900}
    .close-btn{width:32px;height:32px;border-radius:8px;background:var(--bg-3);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.2s}
    .close-btn:active{background:var(--bg-4)}
    
    .admin-badge{position:fixed;bottom:80px;right:20px;background:rgba(201,160,48,.2);border:1px solid rgba(201,160,48,.4);border-radius:12px;padding:10px 14px;font-size:12px;color:var(--gold-1);font-weight:800;z-index:100;display:none}
    .admin-badge.show{display:block}
  </style>
</head>
<body>
  <!-- Splash Screen -->
  <section id="splash" class="screen splash-screen active">
    <div class="splash-logo" id="splash-logo">ر</div>
    <div class="splash-text">
      <h1>رصد</h1>
      <p>إدارة مالية ذكية وآمنة</p>
    </div>
  </section>

  <!-- PIN Screen -->
  <section id="pin-screen" class="screen pin-screen">
    <div class="pin-container">
      <h2 class="pin-title">أدخل الرقم السري</h2>
      <div class="pin-dots" id="pin-dots"></div>
      <div class="pin-pad" id="pin-pad"></div>
    </div>
  </section>

  <!-- Auth Screen -->
  <section id="auth" class="screen auth-screen">
    <div class="brand-card">
      <div class="coin-logo" id="coin-logo">ر</div>
      <h1>رصد</h1>
      <p>تطبيق لإدارة دخلك ومصاريفك شهر بشهر وبأي عملة تختارها.</p>
    </div>

    <div class="auth-card">
      <div class="tabs">
        <button class="tab active" id="login-tab" onclick="switchTab('login')">تسجيل الدخول</button>
        <button class="tab" id="signup-tab" onclick="switchTab('signup')">حساب جديد</button>
      </div>

      <form id="login-form" class="form active" onsubmit="login(event)">
        <div class="error" id="login-error"></div>
        <label>البريد الإلكتروني
          <input id="login-email" type="email" placeholder="example@email.com" required />
        </label>
        <label>كلمة المرور
          <input id="login-password" type="password" placeholder="••••••••" required />
        </label>
        <button class="primary-btn" type="submit">دخول</button>
      </form>

      <form id="signup-form" class="form" onsubmit="signup(event)">
        <div class="error" id="signup-error"></div>
        <label>الاسم
          <input id="signup-name" type="text" placeholder="اكتب اسمك" required />
        </label>
        <label>البريد الإلكتروني
          <input id="signup-email" type="email" placeholder="example@email.com" required />
        </label>
        <label>كلمة المرور
          <input id="signup-password" type="password" placeholder="6 أحرف على الأقل" minlength="6" required />
        </label>
        <label>تأكيد كلمة المرور
          <input id="signup-password2" type="password" placeholder="أعد كتابة كلمة المرور" required />
        </label>
        <label>الرقم السري (4 أرقام)
          <input id="signup-pin" type="text" placeholder="0000" maxlength="4" inputmode="numeric" required />
        </label>
        <button class="primary-btn" type="submit">إنشاء الحساب</button>
      </form>
    </div>
  </section>

  <!-- Onboarding Screen -->
  <section id="onboarding" class="screen onboarding-screen">
    <div class="top-line">
      <span id="onboarding-step">خطوة 1 من 4</span>
      <button class="link-btn" onclick="skipOnboarding()">تخطي</button>
    </div>
    <div class="progress-dots" id="progress-dots"></div>
    <div class="onboarding-body" id="onboarding-body"></div>
    <button class="primary-btn bottom-btn" id="onboarding-next" onclick="nextOnboarding()">التالي</button>
  </section>

  <!-- App Screen -->
  <section id="app" class="screen app-screen">
    <div class="app-header">
      <div>
        <div class="muted">مساء الخير</div>
        <h2 id="user-name">المستخدم</h2>
      </div>
      <div class="header-actions">
        <button class="ghost-btn" onclick="addIncome()">+ دخل</button>
        <button class="avatar" id="avatar" onclick="showSettings()">U</button>
      </div>
    </div>

    <div id="app-content"></div>

    <div class="bottom-nav">
      <button class="nav-btn active" onclick="switchTab('home')">
        <div class="nav-icon">🏠</div>
        <div>الرئيسية</div>
      </button>
      <button class="nav-btn" onclick="switchTab('month')">
        <div class="nav-icon">📅</div>
        <div>الشهر</div>
      </button>
      <button class="nav-btn" onclick="addTransaction()">
        <div class="nav-icon">➕</div>
        <div>إضافة</div>
      </button>
      <button class="nav-btn" onclick="switchTab('wealth')">
        <div class="nav-icon">💰</div>
        <div>ثروتي</div>
      </button>
      <button class="nav-btn" onclick="switchTab('settings')">
        <div class="nav-icon">⚙️</div>
        <div>الإعدادات</div>
      </button>
    </div>
  </section>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-card" id="modal-content"></div>
  </div>

  <!-- Admin Badge -->
  <div class="admin-badge" id="admin-badge"></div>

  <script>
    // ==================== STATE MANAGEMENT ====================
    let currentUser = null;
    let allUsers = {};
    let currentTab = 'home';
    let pinInput = '';
    let pinMode = 'login';
    let setupPin = '';
    let logoClickCount = 0;
    let logoClickTimer = null;

    // ==================== INITIALIZATION ====================
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('splash').classList.remove('active');
        loadUsers();
        const savedUser = localStorage.getItem('currentUser');
        if (savedUser) {
          currentUser = JSON.parse(savedUser);
          showPinScreen('login');
        } else {
          showScreen('auth');
        }
      }, 2000);
    });

    // ==================== ADMIN FEATURE ====================
    function handleLogoClick() {
      logoClickCount++;
      clearTimeout(logoClickTimer);
      logoClickTimer = setTimeout(() => logoClickCount = 0, 500);
      
      if (logoClickCount === 5) {
        logoClickCount = 0;
        showAdminPanel();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const logo = document.getElementById('splash-logo');
      const coinLogo = document.getElementById('coin-logo');
      if (logo) logo.addEventListener('click', handleLogoClick);
      if (coinLogo) coinLogo.addEventListener('click', handleLogoClick);
    });

    function showAdminPanel() {
      const userCount = Object.keys(allUsers).length;
      const badge = document.getElementById('admin-badge');
      badge.textContent = `👤 عدد المستخدمين: ${userCount}`;
      badge.classList.add('show');
      setTimeout(() => badge.classList.remove('show'), 5000);
    }

    // ==================== PIN SCREEN ====================
    function showPinScreen(mode) {
      pinMode = mode;
      pinInput = '';
      setupPin = '';
      renderPinPad();
      showScreen('pin-screen');
    }

    function renderPinPad() {
      const dotsContainer = document.getElementById('pin-dots');
      const padContainer = document.getElementById('pin-pad');
      
      dotsContainer.innerHTML = '';
      for (let i = 0; i < 4; i++) {
        const dot = document.createElement('div');
        dot.className = `pin-dot ${i < pinInput.length ? 'filled' : ''}`;
        dotsContainer.appendChild(dot);
      }

      if (padContainer.children.length === 0) {
        for (let i = 1; i <= 9; i++) {
          const btn = document.createElement('button');
          btn.className = 'pin-btn';
          btn.textContent = i;
          btn.type = 'button';
          btn.onclick = () => addPinDigit(i);
          padContainer.appendChild(btn);
        }
        
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'pin-btn delete';
        deleteBtn.textContent = '⌫';
        deleteBtn.type = 'button';
        deleteBtn.onclick = removePinDigit;
        padContainer.appendChild(deleteBtn);
        
        const zeroBtn = document.createElement('button');
        zeroBtn.className = 'pin-btn zero';
        zeroBtn.textContent = '0';
        zeroBtn.type = 'button';
        zeroBtn.onclick = () => addPinDigit(0);
        padContainer.appendChild(zeroBtn);
      }
    }

    function addPinDigit(digit) {
      if (pinInput.length < 4) {
        pinInput += digit;
        updatePinDots();
        if (pinInput.length === 4) {
          setTimeout(checkPin, 300);
        }
      }
    }

    function removePinDigit() {
      pinInput = pinInput.slice(0, -1);
      updatePinDots();
    }

    function updatePinDots() {
      const dots = document.querySelectorAll('.pin-dot');
      dots.forEach((dot, i) => {
        if (i < pinInput.length) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      });
    }

    function checkPin() {
      if (pinMode === 'login') {
        if (pinInput === currentUser.pin) {
          showScreen('app');
          renderApp();
        } else {
          pinInput = '';
          updatePinDots();
          alert('رقم سري خاطئ');
        }
      } else if (pinMode === 'setup') {
        if (!setupPin) {
          setupPin = pinInput;
          pinInput = '';
          updatePinDots();
          document.querySelector('.pin-title').textContent = 'أعد إدخال الرقم السري';
        } else if (pinInput === setupPin) {
          currentUser.pin = pinInput;
          localStorage.setItem('currentUser', JSON.stringify(currentUser));
          allUsers[currentUser.email] = currentUser;
          localStorage.setItem('allUsers', JSON.stringify(allUsers));
          showScreen('onboarding');
          initOnboarding();
        } else {
          setupPin = '';
          pinInput = '';
          updatePinDots();
          document.querySelector('.pin-title').textContent = 'أدخل الرقم السري';
          alert('الأرقام السرية غير متطابقة');
        }
      }
    }

    // ==================== AUTH ====================
    function switchTab(tab) {
      if (tab === 'login' || tab === 'signup') {
        document.getElementById('login-form').classList.toggle('active', tab === 'login');
        document.getElementById('signup-form').classList.toggle('active', tab === 'signup');
        document.getElementById('login-tab').classList.toggle('active', tab === 'login');
        document.getElementById('signup-tab').classList.toggle('active', tab === 'signup');
      }
    }

    function login(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const user = allUsers[email];

      if (!user || user.password !== password) {
        showError('login-error', 'البريد أو كلمة المرور غير صحيحة');
        return;
      }

      currentUser = user;
      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      showPinScreen('login');
    }

    function signup(e) {
      e.preventDefault();
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const password2 = document.getElementById('signup-password2').value;

      if (password !== password2) {
        showError('signup-error', 'كلمات المرور غير متطابقة');
        return;
      }

      if (allUsers[email]) {
        showError('signup-error', 'هذا البريد مسجل بالفعل');
        return;
      }

      currentUser = {
        email,
        name,
        password,
        pin: '',
        months: {},
        debts: [],
        goals: [],
        baseCurrency: 'EGP'
      };

      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      showPinScreen('setup');
    }

    function showError(elementId, message) {
      const errorEl = document.getElementById(elementId);
      errorEl.textContent = message;
      errorEl.classList.add('show');
      setTimeout(() => errorEl.classList.remove('show'), 3000);
    }

    // ==================== ONBOARDING ====================
    function initOnboarding() {
      const steps = [
        { title: 'أهلاً بيك في رصد', text: 'هنسألك شوية أسئلة بسيطة أول مرة بس عشان التطبيق يشتغل على بياناتك من البداية.' },
        { title: 'اختر عملاتك', text: 'تحديد العملات اللي بتتعامل بيها (مثل جنيه، دولار، يورو)' },
        { title: 'دخلك الشهري', text: 'أدخل دخلك الشهري الحالي عشان نحسب لك قيمة دقيقتك' },
        { title: 'ميزانيتك', text: 'حدد الميزانية الشهرية اللي بتريد تصرفها' }
      ];

      let currentStep = 0;
      window.nextOnboarding = () => {
        if (currentStep < steps.length - 1) {
          currentStep++;
          renderOnboardingStep(steps, currentStep);
        } else {
          showScreen('app');
          renderApp();
        }
      };
      window.skipOnboarding = () => {
        showScreen('app');
        renderApp();
      };

      renderOnboardingStep(steps, 0);
    }

    function renderOnboardingStep(steps, step) {
      document.getElementById('onboarding-step').textContent = `خطوة ${step + 1} من 4`;
      const body = document.getElementById('onboarding-body');
      body.innerHTML = `<h1>${steps[step].title}</h1><p>${steps[step].text}</p>`;
      
      const dots = document.getElementById('progress-dots');
      dots.innerHTML = '';
      for (let i = 0; i < 4; i++) {
        const dot = document.createElement('span');
        dot.className = i <= step ? 'active' : '';
        dots.appendChild(dot);
      }
    }

    // ==================== APP RENDERING ====================
    function renderApp() {
      currentTab = 'home';
      updateNavigation();
      renderHomeTab();
    }

    function renderHomeTab() {
      const content = document.getElementById('app-content');
      const currentMonth = new Date().toISOString().slice(0, 7);
      const monthData = currentUser.months[currentMonth] || { income: 0, expenses: 0, budget: 0, transactions: [], categories: {} };

      content.innerHTML = `
        <div class="month-tabs">
          <button class="month-tab active" onclick="switchMonth('${currentMonth}')">${new Date().toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' })}</button>
          <button class="month-tab" onclick="addNewMonth()">+ شهر جديد</button>
        </div>

        <div class="summary-card">
          <div class="summary-row">
            <span class="summary-label">صافي الشهر</span>
            <span class="summary-value">${(monthData.income - monthData.expenses).toFixed(2)} ${currentUser.baseCurrency}</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">دخل الشهر</span>
            <span class="summary-value" style="color: var(--green)">${monthData.income.toFixed(2)} ${currentUser.baseCurrency}</span>
          </div>
          <div class="summary-row">
            <span class="summary-label">مصاريف الشهر</span>
            <span class="summary-value" style="color: var(--red)">${monthData.expenses.toFixed(2)} ${currentUser.baseCurrency}</span>
          </div>
        </div>

        ${renderExpenseChart(monthData)}

        <div style="display: flex; gap: 10px; margin-bottom: 16px;">
          <button class="ghost-btn" style="flex: 1;" onclick="addTransaction('expense')">مصروف +</button>
          <button class="ghost-btn" style="flex: 1;" onclick="addTransaction('income')">دخل +</button>
        </div>

        <h3 class="section-title">آخر العمليات</h3>
        <div id="transactions-list"></div>
      `;

      renderTransactionsList(monthData.transactions || []);
    }

    function renderExpenseChart(monthData) {
      if (!monthData.transactions || monthData.transactions.length === 0) {
        return '<div class="muted-text" style="text-align: center; padding: 20px;">لا توجد عمليات لعرض الرسم البياني</div>';
      }

      const categories = {};
      monthData.transactions.forEach(t => {
        if (t.type === 'expense') {
          categories[t.category] = (categories[t.category] || 0) + t.amount;
        }
      });

      const total = Object.values(categories).reduce((a, b) => a + b, 0);
      if (total === 0) return '<div class="muted-text" style="text-align: center; padding: 20px;">لا توجد مصاريف</div>';

      const colors = ['#00c896', '#3d8eff', '#ffb020', '#ff4d5e', '#c9a030', '#f5d770'];
      let chartHTML = '<div class="chart-container"><svg class="pie-chart" viewBox="0 0 100 100">';
      
      let currentAngle = 0;
      let labelIndex = 0;
      
      Object.entries(categories).forEach(([category, amount], idx) => {
        const percentage = (amount / total) * 100;
        const sliceAngle = (percentage / 100) * 360;
        const startAngle = currentAngle;
        const endAngle = currentAngle + sliceAngle;
        
        const startRad = (startAngle * Math.PI) / 180;
        const endRad = (endAngle * Math.PI) / 180;
        
        const x1 = 50 + 40 * Math.cos(startRad);
        const y1 = 50 + 40 * Math.sin(startRad);
        const x2 = 50 + 40 * Math.cos(endRad);
        const y2 = 50 + 40 * Math.sin(endRad);
        
        const largeArc = sliceAngle > 180 ? 1 : 0;
        const path = `M 50 50 L ${x1} ${y1} A 40 40 0 ${largeArc} 1 ${x2} ${y2} Z`;
        
        chartHTML += `<path d="${path}" fill="${colors[idx % colors.length]}" stroke="var(--bg)" stroke-width="1"/>`;
        
        currentAngle = endAngle;
      });
      
      chartHTML += '</svg>';
      
      currentAngle = 0;
      Object.entries(categories).forEach(([category, amount], idx) => {
        const percentage = (amount / total) * 100;
        const sliceAngle = (percentage / 100) * 360;
        const midAngle = currentAngle + sliceAngle / 2;
        const midRad = (midAngle * Math.PI) / 180;
        
        const labelX = 50 + 28 * Math.cos(midRad);
        const labelY = 50 + 28 * Math.sin(midRad);
        
        chartHTML += `
          <div class="chart-label" style="left: ${labelX}%; top: ${labelY}%; transform: translate(-50%, -50%);">
            <div class="chart-percentage">${percentage.toFixed(0)}%</div>
            <div class="chart-name">${category}</div>
          </div>
        `;
        
        currentAngle += sliceAngle;
      });
      
      chartHTML += '</div>';
      return chartHTML;
    }

    function renderTransactionsList(transactions) {
      const list = document.getElementById('transactions-list');
      if (!transactions || transactions.length === 0) {
        list.innerHTML = '<div class="muted-text">لا توجد عمليات في هذا الشهر بعد. أضف دخلك ومصاريفك لتبدأ المتابعة.</div>';
        return;
      }

      list.innerHTML = transactions.map(t => `
        <div class="debt-item">
          <div class="debt-info">
            <div class="debt-name">${t.name}</div>
            <div class="debt-date">${t.date} - ${t.category}</div>
          </div>
          <div class="debt-amount" style="color: ${t.type === 'income' ? 'var(--green)' : 'var(--red)'}">${t.type === 'income' ? '+' : '-'}${t.amount} ${t.currency}</div>
        </div>
      `).join('');
    }

    function switchMonth(month) {
      // Implementation for switching months
    }

    function addNewMonth() {
      // Implementation for adding new month
    }

    function addTransaction(type = null) {
      const modal = document.getElementById('modal-overlay');
      const content = document.getElementById('modal-content');
      
      content.innerHTML = `
        <div class="modal-header">
          <h3>${type === 'income' ? 'إضافة دخل' : type === 'expense' ? 'إضافة مصروف' : 'إضافة عملية'}</h3>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <form onsubmit="saveTransaction(event, '${type || 'expense'}')">
          <label>الوصف
            <input type="text" id="trans-name" placeholder="اكتب وصف العملية" required />
          </label>
          <label>المبلغ
            <input type="number" id="trans-amount" placeholder="0.00" step="0.01" required />
          </label>
          <label>العملة
            <select id="trans-currency">
              <option value="EGP">جنيه مصري</option>
              <option value="USD">دولار</option>
              <option value="EUR">يورو</option>
            </select>
          </label>
          <label>الفئة
            <input type="text" id="trans-category" placeholder="مثل: أكل، مواصلات، ملابس" required />
          </label>
          <label>التاريخ
            <input type="date" id="trans-date" required />
          </label>
          <button class="primary-btn" type="submit">حفظ</button>
        </form>
      `;
      
      document.getElementById('trans-date').valueAsDate = new Date();
      modal.classList.add('active');
    }

    function saveTransaction(e, type) {
      e.preventDefault();
      const currentMonth = new Date().toISOString().slice(0, 7);
      
      if (!currentUser.months[currentMonth]) {
        currentUser.months[currentMonth] = { income: 0, expenses: 0, budget: 0, transactions: [] };
      }

      const transaction = {
        name: document.getElementById('trans-name').value,
        amount: parseFloat(document.getElementById('trans-amount').value),
        currency: document.getElementById('trans-currency').value,
        date: document.getElementById('trans-date').value,
        category: document.getElementById('trans-category').value,
        type: type
      };

      currentUser.months[currentMonth].transactions.push(transaction);
      
      if (type === 'income') {
        currentUser.months[currentMonth].income += transaction.amount;
      } else {
        currentUser.months[currentMonth].expenses += transaction.amount;
      }

      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      closeModal();
      renderHomeTab();
    }

    function addIncome() {
      addTransaction('income');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
    }

    function showSettings() {
      const modal = document.getElementById('modal-overlay');
      const content = document.getElementById('modal-content');
      
      content.innerHTML = `
        <div class="modal-header">
          <h3>الإعدادات</h3>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <button class="secondary-btn" onclick="logout()">تسجيل الخروج</button>
        </div>
      `;
      
      modal.classList.add('active');
    }

    function logout() {
      localStorage.removeItem('currentUser');
      location.reload();
    }

    function updateNavigation() {
      const buttons = document.querySelectorAll('.nav-btn');
      buttons.forEach((btn, i) => {
        btn.classList.toggle('active', i === ['home', 'month', 'add', 'wealth', 'settings'].indexOf(currentTab));
      });
    }

    function loadUsers() {
      const saved = localStorage.getItem('allUsers');
      allUsers = saved ? JSON.parse(saved) : {};
    }

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }
  </script>
